services:
  - type: web
    name: easy-comm-beta
    env: node
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MODEL_PROVIDER
        value: openai-compatible
      - key: MODEL_BASE_URL
        value: https://api.deepseek.com
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: deepseek-v4-flash
      - key: MODEL_THINKING
        value: disabled
      - key: MODEL_TIMEOUT_MS
        value: 45000
      - key: KNOWLEDGE_MAX_CHUNKS
        value: 5
      - key: KNOWLEDGE_MAX_CHARS
        value: 12000

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受众分析 - 简单传播</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="logo">简</div>
            <span>简单传播</span>
        </a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="topic.html">热点选题</a>
            <a href="sentiment.html">舆情分析</a>
            <a href="audience.html" class="active">受众分析</a>
            <a href="plan.html">内容策划</a>
        </div>
    </nav>

    <main class="page-container">
        <div class="page-header">
            <div class="page-title">
                <a href="index.html" class="page-back">← 返回</a>
                <h1>🎭 受众分析（百变怪）</h1>
                <span class="subtitle">深入洞察目标群体</span>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="downloadPDF()">📄 下载PDF</button>
                <button class="btn btn-primary" onclick="analyze()" id="analyzeBtn">🔍 开始分析</button>
            </div>
        </div>

        <!-- 分析内容 -->
        <div class="input-card">
            <div class="input-card-title">📝 传播内容评估 <span style="color:#ff6b6b;font-weight:normal">* 必填</span></div>
            <div class="input-group">
                <label>输入要评估的内容</label>
                <textarea id="content" placeholder="输入要传播的文本、策划案或内容..."></textarea>
            </div>
            <div class="input-group">
                <label>传播目标 <span class="optional">选填</span></label>
                <input type="text" id="goal" placeholder="如：提升品牌认知度、促进产品购买">
            </div>
        </div>

        <!-- 分析结果 -->
        <div id="resultArea">
            <p style="text-align:center;color:#999;padding:40px">
                请输入要评估的内容，点击「开始分析」
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const userInfo = JSON.parse(localStorage.getItem('simple_user_info') || '{}');
        
        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substring(2, 15);
        }
        
        async function callCozeAPI(prompt, onChunk, onDone) {
            const sessionId = generateSessionId();
            const url = `${CONFIG.API_BASE}/stream_run`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + CONFIG.BEARER_TOKEN,
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        content: {
                            query: {
                                prompt: [{ type: 'text', content: { text: prompt } }]
                            }
                        },
                        type: 'query',
                        session_id: sessionId,
                        project_id: '7639400504908480539'
                    })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    onChunk('请求失败: ' + errText);
                    return;
                }
                
                if (!response.body) {
                    onChunk('无响应内容');
                    return;
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const blocks = buffer.split('\n\n');
                    buffer = blocks.pop() ?? '';
                    
                    for (const block of blocks) {
                        const dataLines = block
                            .split('\n')
                            .filter(line => line.startsWith('data:'))
                            .map(line => line.slice(5).trim());
                        
                        for (const dataText of dataLines) {
                            try {
                                const parsed = JSON.parse(dataText);
                                if (parsed.content) {
                                    onChunk(parsed.content);
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                onDone();
            } catch (error) {
                onChunk('网络错误: ' + error.message);
                onDone();
            }
        }
        
        function formatResult(text) {
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        }
        
        async function analyze() {
            const content = document.getElementById('content').value.trim();
            if (!content) {
                alert('请输入要评估的内容');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 分析中';
            
            const goal = document.getElementById('goal').value.trim();
            
            const prompt = `你是简单传播的AI受众分析专家（百变怪）。现在是 ${new Date().toLocaleDateString('zh-CN')}。

用户信息：
- 身份：${userInfo.identity}
- 公司：${userInfo.company}
- 行业：${userInfo.industry}
${goal ? '- 传播目标：' + goal : ''}

请调用【Chameleon】技能，对以下内容进行受众反应预测分析：

---
${content}
---

请模拟不同受众群体可能的反应：
1. 👏 核心支持者 - 可能的正面反应
2. 🤔 中立观望者 - 可能的观望态度
3. ⚠️ 潜在批评者 - 可能质疑的点
4. 🤐 沉默大多数 - 不表达但会受影响的人
5. 🚨 传播风险预警 - 需要注意的风险

最后给出优化建议。

以Markdown格式输出。`;
            
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="loading">AI正在分析受众反应...</div>';
            
            let resultText = '';
            await callCozeAPI(
                prompt,
                (chunk) => { resultText += chunk; resultArea.innerHTML = `<div class="result-card"><div class="result-header"><div class="result-title">🎭 传播反馈预测</div></div><div class="result-content">${formatResult(resultText)}<span class="typing"></span></div></div>`; },
                () => {
                    resultArea.innerHTML = `<div class="result-card"><div class="result-header"><div class="result-title">🎭 传播反馈预测</div></div><div class="result-content">${formatResult(resultText)}</div></div>`;
                    btn.disabled = false;
                    btn.innerHTML = '🔍 开始分析';
                }
            );
        }
        
        function downloadPDF() {
            alert('PDF下载功能开发中，请稍候...');
        }
    </script>
</body>
</html>

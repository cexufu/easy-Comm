<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受众分析 - 简单传播</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="logo">简</div>
            <span>简单传播</span>
        </a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="topic.html">热点选题</a>
            <a href="sentiment.html">舆情分析</a>
            <a href="audience.html" class="active">受众分析</a>
            <a href="plan.html">内容策划</a>
        </div>
    </nav>

    <main class="page-container">
        <div class="page-header">
            <div class="page-title">
                <a href="index.html" class="page-back">← 返回</a>
                <h1>🎭 受众分析（百变怪）</h1>
                <span class="subtitle">深入洞察目标群体</span>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="downloadPDF()">📄 下载PDF</button>
                <button class="btn btn-primary" onclick="analyze()" id="analyzeBtn">🔍 开始分析</button>
            </div>
        </div>

        <!-- 分析内容 -->
        <div class="input-card">
            <div class="input-card-title">📝 传播内容评估 <span style="color:#ff6b6b;font-weight:normal">* 必填</span></div>
            <div class="input-group">
                <label>输入要评估的内容</label>
                <textarea id="content" placeholder="输入要传播的文本、策划案或内容..."></textarea>
            </div>
            <div class="input-group">
                <label>传播目标 <span class="optional">选填</span></label>
                <input type="text" id="goal" placeholder="如：提升品牌认知度、促进产品购买">
            </div>
        </div>

        <!-- 分析结果 -->
        <div id="resultArea">
            <p style="text-align:center;color:#999;padding:40px">
                请输入要评估的内容，点击「开始分析」
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const userInfo = JSON.parse(localStorage.getItem('simple_user_info') || '{}');
        
        async function callCozeAPI(prompt) {
            try {
                const response = await fetch(`${CONFIG.API_BASE}/v3/chat`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.PAT_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        bot_id: CONFIG.BOT_ID,
                        user_id: 'simple_user_' + Date.now(),
                        stream: false,
                        auto_save_history: true,
                        additional_messages: [{
                            role: 'user',
                            content: prompt,
                            content_type: 'text'
                        }]
                    })
                });
                
                const data = await response.json();
                if (data.code === 0 && data.data && data.data.messages) {
                    const aiMessage = data.data.messages.find(m => m.role === 'assistant' && m.type === 'answer');
                    return aiMessage ? aiMessage.content : '抱歉，暂时无法获取回复。';
                }
                return '请求失败: ' + (data.msg || '未知错误');
            } catch (error) {
                return '网络错误: ' + error.message;
            }
        }
        
        async function analyze() {
            const content = document.getElementById('content').value.trim();
            if (!content) {
                alert('请输入要评估的内容');
                return;
            }
            
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 分析中<span class="loading"></span>';
            
            const goal = document.getElementById('goal').value.trim();
            
            const prompt = `你是简单传播的AI受众分析专家（百变怪）。现在是 ${new Date().toLocaleDateString('zh-CN')}。

用户信息：
- 身份：${userInfo.identity}
- 公司：${userInfo.company}
- 行业：${userInfo.industry}
${goal ? '- 传播目标：' + goal : ''}

请调用【Chameleon】技能，对以下内容进行受众反应预测分析：

---
${content}
---

请模拟不同受众群体可能的反应：
1. 👏 核心支持者 - 可能的正面反应
2. 🤔 中立观望者 - 可能的观望态度
3. ⚠️ 潜在批评者 - 可能质疑的点
4. 🤐 沉默大多数 - 不表达但会受影响的人
5. 🚨 传播风险预警 - 需要注意的风险

最后给出优化建议。

以Markdown格式输出。`;
            
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="loading">AI正在分析受众反应...</div>';
            
            const result = await callCozeAPI(prompt);
            resultArea.innerHTML = `<div class="result-card">
                <div class="result-header">
                    <div class="result-title">🎭 传播反馈预测</div>
                </div>
                <div class="result-content">${formatResult(result)}</div>
            </div>`;
            
            btn.disabled = false;
            btn.innerHTML = '🔍 开始分析';
        }
        
        function formatResult(text) {
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        }
        
        function downloadPDF() {
            alert('PDF下载功能开发中，请稍候...');
        }
    </script>
</body>
</html>

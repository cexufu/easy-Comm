<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热点选题 - 简单传播</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="logo">简</div>
            <span>简单传播</span>
        </a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="topic.html" class="active">热点选题</a>
            <a href="sentiment.html">舆情分析</a>
            <a href="audience.html">受众分析</a>
            <a href="plan.html">内容策划</a>
        </div>
    </nav>

    <main class="page-container">
        <div class="page-header">
            <div class="page-title">
                <a href="index.html" class="page-back">← 返回</a>
                <h1>📝 热点选题</h1>
                <span class="subtitle">智能推荐最适配的选题</span>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="downloadPDF()">📄 下载PDF</button>
                <button class="btn btn-primary" onclick="regenerate()" id="regenBtn">🔄 重新生成</button>
            </div>
        </div>

        <!-- 关键词补充 -->
        <div class="input-card">
            <div class="input-card-title">🔑 关键词补充 <span style="color:#999;font-weight:normal">(可选)</span></div>
            <div class="input-group">
                <input type="text" id="keywords" placeholder="输入您想关注的关键词或话题，多个关键词用逗号分隔...">
                <p style="font-size:12px;color:#999;margin-top:6px">例如："新品发布"、"ESG"、"数字化转型"、"出海战略"</p>
            </div>
        </div>

        <!-- 生成结果 -->
        <div id="resultArea">
            <p style="text-align:center;color:#999;padding:40px">
                点击上方「重新生成」按钮，基于您的信息生成精选选题
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const userInfo = JSON.parse(localStorage.getItem('simple_user_info') || '{}');
        
        async function callCozeAPI(prompt) {
            try {
                const response = await fetch(`${CONFIG.API_BASE}/v3/chat`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.PAT_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        bot_id: CONFIG.BOT_ID,
                        user_id: 'simple_user_' + Date.now(),
                        stream: false,
                        auto_save_history: true,
                        additional_messages: [{
                            role: 'user',
                            content: prompt,
                            content_type: 'text'
                        }]
                    })
                });
                
                const data = await response.json();
                if (data.code === 0 && data.data && data.data.messages) {
                    const aiMessage = data.data.messages.find(m => m.role === 'assistant' && m.type === 'answer');
                    return aiMessage ? aiMessage.content : '抱歉，暂时无法获取回复。';
                }
                return '请求失败: ' + (data.msg || '未知错误');
            } catch (error) {
                return '网络错误: ' + error.message;
            }
        }
        
        async function regenerate() {
            const btn = document.getElementById('regenBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中<span class="loading"></span>';
            
            const keywords = document.getElementById('keywords').value;
            const prompt = `你是简单传播的AI选题助手。用户信息：${JSON.stringify(userInfo)}。
用户补充的关键词：${keywords || '无'}

请基于用户信息，生成5个最适合的热点选题，每个选题包含：
1. 标题
2. 话题标签（2-3个）
3. 选题内容描述
4. 选择理由

以Markdown格式输出。`;
            
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="loading">AI正在分析热点...</div>';
            
            const result = await callCozeAPI(prompt);
            resultArea.innerHTML = `<div class="result-card">
                <div class="result-header">
                    <div class="result-title">✨ 基于您的信息生成的精选选题</div>
                </div>
                <div class="result-content">${result.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
            </div>`;
            
            btn.disabled = false;
            btn.innerHTML = '🔄 重新生成';
        }
        
        function downloadPDF() {
            alert('PDF下载功能开发中，请稍候...');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热点选题 - 简单传播</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="logo">简</div>
            <span>简单传播</span>
        </a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="topic.html" class="active">热点选题</a>
            <a href="sentiment.html">舆情分析</a>
            <a href="audience.html">受众分析</a>
            <a href="plan.html">内容策划</a>
        </div>
    </nav>

    <main class="page-container">
        <div class="page-header">
            <div class="page-title">
                <a href="index.html" class="page-back">← 返回</a>
                <h1>📝 热点选题</h1>
                <span class="subtitle">智能推荐最适配的选题</span>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" onclick="downloadPDF()">📄 下载PDF</button>
                <button class="btn btn-primary" onclick="regenerate()" id="regenBtn">🔄 重新生成</button>
            </div>
        </div>

        <!-- 关键词补充 -->
        <div class="input-card">
            <div class="input-card-title">🔑 关键词补充 <span style="color:#999;font-weight:normal">(可选)</span></div>
            <div class="input-group">
                <input type="text" id="keywords" placeholder="输入您想关注的关键词或话题，多个关键词用逗号分隔...">
                <p style="font-size:12px;color:#999;margin-top:6px">例如："新品发布"、"ESG"、"数字化转型"、"出海战略"</p>
            </div>
        </div>

        <!-- 生成结果 -->
        <div id="resultArea">
            <p style="text-align:center;color:#999;padding:40px">
                点击「重新生成」按钮，基于您的信息生成精选选题
            </p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const userInfo = JSON.parse(localStorage.getItem('simple_user_info') || '{}');
        
        function generateSessionId() {
            return 'session_' + Math.random().toString(36).substring(2, 15);
        }
        
        async function callCozeAPI(prompt, onChunk, onDone) {
            const sessionId = generateSessionId();
            const url = `${CONFIG.API_BASE}/stream_run`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + CONFIG.BEARER_TOKEN,
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        content: {
                            query: {
                                prompt: [{ type: 'text', content: { text: prompt } }]
                            }
                        },
                        type: 'query',
                        session_id: sessionId,
                        project_id: '7639400504908480539'
                    })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    onChunk('请求失败: ' + errText);
                    return;
                }
                
                if (!response.body) {
                    onChunk('无响应内容');
                    return;
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const blocks = buffer.split('\n\n');
                    buffer = blocks.pop() ?? '';
                    
                    for (const block of blocks) {
                        const dataLines = block
                            .split('\n')
                            .filter(line => line.startsWith('data:'))
                            .map(line => line.slice(5).trim());
                        
                        for (const dataText of dataLines) {
                            try {
                                const parsed = JSON.parse(dataText);
                                if (parsed.content) {
                                    onChunk(parsed.content);
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                onDone();
            } catch (error) {
                onChunk('网络错误: ' + error.message);
                onDone();
            }
        }
        
        function formatResult(text) {
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        }
        
        async function regenerate() {
            const btn = document.getElementById('regenBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中';
            
            const keywords = document.getElementById('keywords').value;
            
            const prompt = `你是简单传播的AI助手。现在是 ${new Date().toLocaleDateString('zh-CN')}。

用户信息：
- 身份：${userInfo.identity}
- 公司：${userInfo.company}
- 行业：${userInfo.industry}
- 城市：${userInfo.city}
- 传播目标：${userInfo.goal}
${userInfo.portfolio ? '- 历史案例：' + userInfo.portfolio : ''}
${keywords ? '- 补充关键词：' + keywords : ''}

请执行以下工作流：
1. 调用【热点选题池】技能，查询今日向前一周内的行业热点
2. 返回收集到的热点池
3. 调用【PR Expert】技能，基于热点池和用户信息，设计出TOP5的热点选题

每个选题需包含：
- 标题
- 话题标签（2-3个）
- 选题内容描述
- 选择理由

以Markdown格式输出。`;
            
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="loading">AI正在分析热点...</div>';
            
            let resultText = '';
            await callCozeAPI(
                prompt,
                (chunk) => { resultText += chunk; resultArea.innerHTML = `<div class="result-card"><div class="result-header"><div class="result-title">✨ 基于您的信息生成的精选选题</div></div><div class="result-content">${formatResult(resultText)}<span class="typing"></span></div></div>`; },
                () => {
                    resultArea.innerHTML = `<div class="result-card"><div class="result-header"><div class="result-title">✨ 基于您的信息生成的精选选题</div></div><div class="result-content">${formatResult(resultText)}</div></div>`;
                    btn.disabled = false;
                    btn.innerHTML = '🔄 重新生成';
                }
            );
        }
        
        function downloadPDF() {
            alert('PDF下载功能开发中，请稍候...');
        }
    </script>
</body>
</html>

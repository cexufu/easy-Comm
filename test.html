<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试</title>
</head>
<body>
    <h1>测试页面</h1>
    <button onclick="testAPI()">测试API</button>
    <div id="result" style="margin-top:20px;padding:20px;background:#f5f5f5;white-space:pre-wrap"></div>
    
    <script src="config.js"></script>
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '测试中...';
            
            const url = CONFIG.API_BASE + '/stream_run';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + CONFIG.BEARER_TOKEN,
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        content: {
                            query: {
                                prompt: [{ type: 'text', content: { text: 'hello' } }]
                            }
                        },
                        type: 'query',
                        session_id: 'test_' + Date.now(),
                        project_id: '7639400504908480539'
                    })
                });
                
                resultDiv.textContent = '状态: ' + response.status + '\n';
                
                if (!response.ok) {
                    const text = await response.text();
                    resultDiv.textContent += '错误: ' + text;
                    return;
                }
                
                resultDiv.textContent += '连接成功！开始读取...\n';
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let count = 0;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done || count > 10) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    resultDiv.textContent += chunk;
                    count++;
                }
                
                resultDiv.textContent += '\n\n测试完成';
            } catch (error) {
                resultDiv.textContent = '错误: ' + error.message;
            }
        }
    </script>
</body>
</html>
